services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=tictactore'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5433:5432' # Хост-порт изменен на 5433 во избежание конфликта
  redis:
    image: 'redis/redis-stack:latest'
    ports:
      - '6379:6379'