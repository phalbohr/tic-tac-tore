services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=tictactore'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5433:5432' # Host port changed to 5433 to avoid conflict
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'