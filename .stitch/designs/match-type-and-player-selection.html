<script>
        function toggleMatch(type) {
            const btn1v1 = document.getElementById('toggle-1v1');
            const btn2v2 = document.getElementById('toggle-2v2');
            const label = document.getElementById('match-label');
            const p2Slot = document.getElementById('p2-slot');
            const p4Slot = document.getElementById('p4-slot');

            if (type === '1v1') {
                btn1v1.classList.add('bg-surface-container-highest', 'text-primary');
                btn1v1.classList.remove('text-on-surface-variant');
                btn2v2.classList.remove('bg-surface-container-highest', 'text-primary');
                btn2v2.classList.add('text-on-surface-variant');
                label.textContent = "Singles Match";
                
                // Animate out slots
                p2Slot.style.opacity = '0.3';
                p2Slot.style.pointerEvents = 'none';
                p4Slot.style.opacity = '0.3';
                p4Slot.style.pointerEvents = 'none';
            } else {
                btn2v2.classList.add('bg-surface-container-highest', 'text-primary');
                btn2v2.classList.remove('text-on-surface-variant');
                btn1v1.classList.remove('bg-surface-container-highest', 'text-primary');
                btn1v1.classList.add('text-on-surface-variant');
                label.textContent = "Doubles Match";
                
                // Animate in slots
                p2Slot.style.opacity = '1';
                p2Slot.style.pointerEvents = 'auto';
                p4Slot.style.opacity = '1';
                p4Slot.style.pointerEvents = 'auto';
            }
        }

        // Micro-interaction for slots
        document.querySelectorAll('.cursor-pointer').forEach(slot => {
            slot.addEventListener('click', function() {
                this.classList.add('scale-[0.98]');
                setTimeout(() => this.classList.remove('scale-[0.98]'), 150);
            });
        });
    </script>
