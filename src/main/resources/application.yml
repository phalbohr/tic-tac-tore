spring:
  datasource:
    url: ${TTT_DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
    driverClassName: ${TTT_DB_DRIVER:org.h2.Driver}
    username: ${TTT_DB_USERNAME}
    password: ${TTT_DB_PASSWORD}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${TTT_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${TTT_GOOGLE_CLIENT_ID}
            client-secret: ${TTT_GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  config:
    import: optional:file:.env[.properties]

application:
  security:
    jwt:
      secret-key: ${TTT_JWT_SECRET:743677397A24432646294A404E635266556A586E3272357538782F413F442847}
      expiration: 86400000 # 1 day
    oauth2:
      redirect-uri: ${TTT_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
    cors:
      allowed-origins: ${TTT_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    vapid:
      public-key: ${TTT_VAPID_PUBLIC_KEY:BEl62iUYgUivxIkv69yViEuiBIa40yYvrx1m0A7Vn65a7p5y_dummy_public_key_string_for_testing_purposes}
      private-key: ${TTT_VAPID_PRIVATE_KEY:dummy_private_key_string_for_testing_purposes}
      subject: ${TTT_VAPID_SUBJECT:mailto:admin@tictactore.com}
    bloom-filter:
      expected-elements: ${TTT_BLOOM_FILTER_EXPECTED_ELEMENTS:100000}
      false-positive-rate: ${TTT_BLOOM_FILTER_FALSE_POSITIVE_RATE:0.01}
    avatar:
      api-url: ${TTT_AVATAR_API_URL:https://api.dicebear.com/7.x/identicon/svg?seed=}
      salt: ${TTT_AVATAR_SALT:default-avatar-salt-for-privacy}

server:
  forward-headers-strategy: native
